# Proyecto de Xcode descrito en texto: `xcodegen generate` crea AlDia.xcodeproj.
# Así el repositorio no guarda el .xcodeproj (miles de líneas generadas) y nunca hay
# conflictos en él.
name: AlDia
options:
  bundleIdPrefix: com.cifuentesf
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Logica:
    path: Logica

targets:
  AlDia:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Logica
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Al día
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Los datos se ven en la app Archivos (En mi iPhone → Al día): así se copian al PC.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cifuentesf.aldia
        PRODUCT_NAME: AlDia
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme: {}
